<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto - CinePlus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Navbar (Tarea 12) -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="../index.html">🎬 CinePlus</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="renta.html">Renta</a></li>
          <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero text-center">
    <h1>📬 Contáctanos</h1>
    <p class="lead">Estamos aquí para ayudarte con lo que necesites</p>
  </header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card p-4">
          <h4 class="text-white mb-4">Envíanos un mensaje</h4>

          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" placeholder="Tu nombre completo">
            <div id="error-nombre" class="text-danger mt-1 d-none" style="font-size:0.82rem;"></div>
          </div>

          <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="correo" placeholder="tu@correo.com">
            <div id="error-correo" class="text-danger mt-1 d-none" style="font-size:0.82rem;"></div>
          </div>

          <!-- Tarea 11: mensaje entre 20 y 50 caracteres -->
          <div class="mb-4">
            <label for="mensaje" class="form-label">
              Mensaje
              <small style="color:#aaa;">(entre 20 y 50 caracteres)</small>
            </label>
            <textarea class="form-control" id="mensaje" rows="3"
              placeholder="Escribe tu consulta aquí..."></textarea>
            <div class="d-flex justify-content-between mt-1">
              <div id="error-mensaje" class="text-danger d-none" style="font-size:0.82rem;"></div>
              <small id="contador-mensaje" style="color:#aaa;margin-left:auto;">0 / 50</small>
            </div>
          </div>

          <button id="btn-enviar" class="btn btn-cineplus w-100 py-2">Enviar Mensaje</button>

          <!-- Alerta de éxito -->
          <div id="alerta-exito" class="alert mt-3 d-none"
               style="background:#1a2a1a;border:1px solid #28a745;color:#a3d9a5;">
            ✅ ¡Mensaje enviado con éxito! Te responderemos a la brevedad.
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container text-center py-3">
      <small>&copy; 2025 CinePlus. Todos los derechos reservados.</small>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Tarea 11: Contador de caracteres en tiempo real
    $('#mensaje').on('input', function () {
      const len = $(this).val().length;
      $('#contador-mensaje').text(len + ' / 50');

      if (len > 50) {
        $('#contador-mensaje').css('color', 'var(--primary)');
      } else if (len >= 20) {
        $('#contador-mensaje').css('color', '#28a745');
      } else {
        $('#contador-mensaje').css('color', '#aaa');
      }
    });

    // Validación y envío (Tarea 11)
    $('#btn-enviar').on('click', function () {
      const nombre = $('#nombre').val().trim();
      const correo = $('#correo').val().trim();
      const mensaje = $('#mensaje').val().trim();
      let valido = true;

      // Validar nombre
      if (!nombre) {
        $('#error-nombre').text('El nombre es obligatorio.').removeClass('d-none');
        $('#nombre').addClass('is-invalid');
        valido = false;
      } else {
        $('#error-nombre').addClass('d-none');
        $('#nombre').removeClass('is-invalid').addClass('is-valid');
      }

      // Validar correo
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!correo || !emailRegex.test(correo)) {
        $('#error-correo').text('Ingresa un correo electrónico válido.').removeClass('d-none');
        $('#correo').addClass('is-invalid');
        valido = false;
      } else {
        $('#error-correo').addClass('d-none');
        $('#correo').removeClass('is-invalid').addClass('is-valid');
      }

      // Validar mensaje entre 20 y 50 caracteres
      if (mensaje.length < 20) {
        $('#error-mensaje').text('El mensaje debe tener al menos 20 caracteres.').removeClass('d-none');
        $('#mensaje').addClass('is-invalid');
        valido = false;
      } else if (mensaje.length > 50) {
        $('#error-mensaje').text('El mensaje no puede superar los 50 caracteres.').removeClass('d-none');
        $('#mensaje').addClass('is-invalid');
        valido = false;
      } else {
        $('#error-mensaje').addClass('d-none');
        $('#mensaje').removeClass('is-invalid').addClass('is-valid');
      }

      if (!valido) return;

      // Éxito
      $('#alerta-exito').removeClass('d-none').hide().fadeIn(400);
      $('#nombre').val('').removeClass('is-valid');
      $('#correo').val('').removeClass('is-valid');
      $('#mensaje').val('').removeClass('is-valid');
      $('#contador-mensaje').text('0 / 50').css('color', '#aaa');

      setTimeout(function () {
        $('#alerta-exito').fadeOut(400, function () { $(this).addClass('d-none'); });
      }, 4000);
    });
  </script>
</body>
</html>
